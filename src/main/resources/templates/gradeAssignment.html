<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta content="text/html; charset=UTF-8">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <link rel="stylesheet" type="text/css" th:href="@{/css/styles.css}">
    <title th:text="'Grade Assignment - ' + ${assignment.name}">Grade Assignment</title>
    <style>
        /* Enhanced Grade Modal Styling */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0, 0, 0, 0.6);
        }

        .modal-content {
            background-color: #f5f5f5;
            margin: 5% auto;
            padding: 25px 30px;
            border-radius: 8px;
            width: 85%;
            max-width: 600px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            position: relative;
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            color: #777;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            transition: color 0.2s;
        }

        .close-btn:hover {
            color: #333;
        }

        #gradeModalBody {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        #submissionDetails {
            background-color: white;
            padding: 18px;
            border-radius: 6px;
            border-left: 4px solid #3a7dcf;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
        }

        #submissionDetails p {
            margin: 8px 0;
            font-size: 15px;
            line-height: 1.4;
        }

        #submissionDetails strong {
            display: inline-block;
            width: 110px;
            font-weight: 600;
        }

        #gradeFileContent {
            margin: 15px 0;
            max-height: 250px;
            overflow-y: auto;
            padding: 10px 0;
            display: none;
        }

        #gradeFileContent img {
            max-width: 100%;
            border-radius: 4px;
            border: 1px solid #eee;
            display: none;
        }

        #gradeInputs {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        #gradeInputs label {
            font-weight: 600;
            display: block;
            margin-bottom: 6px;
            color: #444;
        }

        #gradeScore {
            width: 100px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 15px;
        }

        #teacherFeedback {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 15px;
            resize: vertical;
            min-height: 80px;
        }

        .modal-content button[type="button"] {
            background-color: #3a7dcf;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 4px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
            transition: background-color 0.2s;
        }

        .modal-content button[type="button"]:hover {
            background-color: #2c62a8;
        }

        /* Dark mode styles */
        body.dark-mode .modal-content {
            background-color: #222;
            color: #f5f5f5;
        }

        body.dark-mode .close-btn {
            color: #aaa;
        }

        body.dark-mode .close-btn:hover {
            color: #fff;
        }

        body.dark-mode #submissionDetails {
            background-color: #333;
            border-left-color: #5a8dd5;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
        }

        body.dark-mode #gradeInputs label {
            color: #ddd;
        }

        body.dark-mode #gradeScore,
        body.dark-mode #teacherFeedback {
            background-color: #444;
            color: #fff;
            border-color: #555;
        }

        body.dark-mode #gradeFileContent img {
            border-color: #444;
        }

        body.dark-mode .modal-content button[type="button"] {
            background-color: #4a8adb;
        }

        body.dark-mode .modal-content button[type="button"]:hover {
            background-color: #3b7ac9;
        }

        /* Animation for modal opening */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .modal-content {
            animation: fadeIn 0.3s ease-out;
        }
    </style>
</head>
<body>
<header class="header">
    <div class="session-info">
        <p class="bigger-p" th:text="|Hello, ${name}!|">Hello, user!</p>
        <p class="lesser-p" th:text="|Today is ${date}|">Today is ...</p>
        <p class="bigger-p" th:text="|You are logged in as ${role}.|">You are logged in as ...</p>
    </div>

    <div class="header-actions">
        <button class="mode-toggle" onclick="toggleMode()">
            <img class="mode-icon" th:src="@{/images/mode.svg}" alt="Dark / Light Mode" />
        </button>
        <button class="logout"><a href="/login"><img class="logout-icon" th:src="@{/images/logout.svg}" alt="Logout"/></a></button>
    </div>
</header>
<button class="burger" onclick="toggleMenu()">☰</button>
<nav class="menu" id="menu">
    <button class="close-btn" id="close-menu">←</button>
    <!-- Some quick overview of stuff from the other pages with a link and who is logged in at what date. -->
    <a href="/">Dashboard</a>
    <!-- For students, a list of subjects they are signed into. For teachers, subjects that they manage and signed in students. -->
    <a href="/subjects">Subjects</a>
    <!-- For students, a view of their homework and projects listed by course. For teachers, student works listed by course. -->
    <a href="/submissions">Submissions</a>
    <!-- For students, grades listed by course. For teachers, grades they have given to each student listed by course. -->
    <a href="/grading">Grading</a>
    <div th:if="${role.name() == 'STUDENT' or role.name() == 'ADMIN'}">
        <a href="/upload">Upload</a>
    </div>
    <a href="/export">Export</a>
</nav>

<div class="content">
    <div id="db-div" class="container-sub">
    <h2>Grade Assignment: <span th:text="${assignment.name}">Assignment Name</span></h2>

    <table class="custom-table">
        <thead>
        <tr class="table-headers">
            <th>Assignment</th>
            <th>Student Name</th>
            <th>Submitted At</th>
            <th>Action</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="submission : ${ungradedSubmissions}">
            <!--
                 Wrapping each row in its own form so the action can use the submission variable.
                 The URL includes the assignmentId (from the assignment object) and the submission id.
            -->
            <form th:action="@{/assignments/{assignmentId}/grade(submissionId=${submission.id})}" method="post">
                <td th:text="${assignment.name}">Assignment Name</td>
                <td th:text="${submission.student.firstName} + ' ' + ${submission.student.lastName}">Student Name</td>
                <td th:text="${#temporals.format(submission.submittedAt, 'dd.MM.yyyy HH:mm')}">Submitted At</td>
                <td>
                    <button type="button" class="grade-btn"
                            onclick="openGradeModal(this)"
                            th:attr="data-submission-id=${submission.id}">
                        <img th:src="@{/images/settings_black.svg}" alt="Grade"/>
                    </button>
                </td>
            </form>
        </tr>
        </tbody>
    </table>
</div>
</div>
<!-- Grade Submission Modal -->
<div id="gradeModal" class="modal">
    <div class="modal-content">
        <span class="close-btn" onclick="toggleGradeModal()">&times;</span>
        <div id="gradeModalBody">
            <!-- Submission details loaded via AJAX -->
            <div id="submissionDetails">
                <p><strong>Student:</strong> <span id="gradeStudentName"></span></p>
                <p><strong>Uploaded File:</strong> <span id="gradeUploadedFile" style="display:none;"></span></p>
                <p><strong>00007ass_00004stud_00008sub</strong></p>
                <!-- If it’s an image, we display an image; if not, display text -->
                <div id="gradeFileContent"></div>
                <p><strong>Comment:</strong> <span id="gradeStudentComment"></span></p>
            </div>
            <!-- Teacher grading inputs -->
            <div id="gradeInputs">
                <label for="gradeScore">Grade (0-100):</label>
                <input type="number" id="gradeScore" name="gradeScore" min="0" max="100" required />

                <label for="teacherFeedback">Feedback:</label>
                <textarea id="teacherFeedback" name="teacherFeedback" rows="3"></textarea>
            </div>
        </div>
        <button type="button" onclick="confirmGrade()">Submit Grade</button>
    </div>
</div>
<script th:src="@{/js/gradeAssignmentAjax.js}"></script>
<script th:src="@{/js/editButton.js}"></script>
<script th:src="@{/js/script.js}"></script>
</body>
</html>
